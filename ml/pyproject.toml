[project]
name = "mise-ml"
version = "0.1.0"
description = "Catalog pipeline and teacher-student mood model for mise"
readme = "README.md"
authors = [
    { name = "Telesphoreo", email = "me@telesphoreo.me" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.103",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "numpy>=2.5.3",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "torchvision",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "xgrammar>=0.2.8",
]

[project.scripts]
mise-ml = "mise_ml.__main__:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
