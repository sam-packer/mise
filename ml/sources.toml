# Raw sources for `uv run moodml fetch`. Paths are relative to data/raw/.
# fetch downloads each missing file and checks its size and SHA-256.
# A mismatch stops fetch: the source changed upstream.
# Nothing under data/ is committed. fetch rebuilds it from these sources.
# kind: "file" (download), "zip" (download and extract), "snapshot" (built from an API),
# "manual" (gated; you download it by hand; optional).

[[source]]
name = "MovieLens ml-latest (includes the Tag Genome)"
url = "https://files.grouplens.org/datasets/movielens/ml-latest.zip"
path = "movielens/ml-latest.zip"
kind = "zip"
sha256 = "66a9e518c747d76b241d9a859b001a2619d3ed1672ceef599eb50daf73a7b4a3"
bytes = 350896731
license = "GroupLens research license: research and non-commercial use only, no redistribution"

